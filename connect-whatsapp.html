<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect WhatsApp number to Cloud API</title>
<style>
  :root { --ink:#16302b; --muted:#5b6f6a; --line:#cfdcd8; --wa:#0f7a5a; --bg:#f3f7f6; --err:#a1261d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 "Segoe UI", system-ui, sans-serif; }
  main { max-width:620px; margin:48px auto; padding:0 20px; }
  h1 { font-size:1.6rem; margin:0 0 6px; }
  p.lead { color:var(--muted); margin:0 0 28px; }
  label { display:block; font-weight:600; margin:16px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  input:focus-visible, button:focus-visible { outline:3px solid #9fd8c4; outline-offset:1px; }
  small { color:var(--muted); }
  button { margin-top:24px; padding:12px 20px; border:0; border-radius:6px; background:var(--wa); color:#fff; font:600 1rem inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  ol#log { margin:28px 0 0; padding-left:22px; }
  ol#log li { margin:6px 0; }
  li.err { color:var(--err); }
  pre { background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px; overflow-x:auto; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>Connect your WhatsApp Business App number</h1>
  <p class="lead">Run this once. It links your existing number to the Cloud API, subscribes your app, and syncs contacts and chat history. Nothing here is saved.</p>

  <label for="appId">App ID</label>
  <input id="appId" placeholder="From App settings → Basic">
  <label for="configId">Configuration ID</label>
  <input id="configId" placeholder="From Facebook Login for Business → Configurations">
  <label for="secret">App secret</label>
  <input id="secret" type="password" placeholder="Used only in this browser tab">
  <small>The auth code expires in about 30 seconds, so this page exchanges it for you immediately.</small>
  <br>
  <button id="go">Connect number</button>

  <ol id="log"></ol>
  <div id="result"></div>
</main>

<script>
const V = 'v23.0';
const G = `https://graph.facebook.com/${V}`;
const $ = id => document.getElementById(id);
let session = {};

function log(msg, isErr) {
  const li = document.createElement('li');
  li.textContent = msg;
  if (isErr) li.className = 'err';
  $('log').appendChild(li);
}

// Embedded Signup sends WABA ID and phone number ID through postMessage
window.addEventListener('message', (e) => {
  if (!e.origin.endsWith('facebook.com')) return;
  try {
    const d = JSON.parse(e.data);
    if (d.type !== 'WA_EMBEDDED_SIGNUP') return;
    if (d.event && d.event.startsWith('FINISH')) {
      session.waba = d.data.waba_id;
      session.phone = d.data.phone_number_id;
      log(`Signup finished. WABA ${session.waba}, phone number ID ${session.phone || '(check WhatsApp Manager)'}`);
    } else if (d.event === 'CANCEL') {
      log(`Signup cancelled at step: ${d.data.current_step || 'unknown'}`, true);
    } else if (d.event === 'ERROR') {
      log(`Signup error: ${d.data.error_message}`, true);
    }
  } catch (_) {}
});

async function graph(path, method = 'GET', token, body) {
  const res = await fetch(`${G}/${path}`, {
    method,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);
  return json;
}

async function finish(code) {
  try {
    const q = new URLSearchParams({ client_id: $('appId').value.trim(), client_secret: $('secret').value.trim(), code });
    const t = await (await fetch(`${G}/oauth/access_token?${q}`)).json();
    if (t.error) throw new Error(t.error.message);
    const token = t.access_token;
    log('Auth code exchanged for a business token.');

    // Wait briefly for the postMessage event if it hasn't arrived yet
    for (let i = 0; i < 20 && !session.waba; i++) await new Promise(r => setTimeout(r, 250));
    if (!session.waba) throw new Error('No WABA ID received from the signup window.');

    await graph(`${session.waba}/subscribed_apps`, 'POST', token);
    log('App subscribed to your WhatsApp Business Account.');

    if (session.phone) {
      await graph(`${session.phone}/smb_app_data`, 'POST', token, { messaging_product: 'whatsapp', sync_type: 'smb_app_state_sync' });
      log('Contacts sync started.');
      await graph(`${session.phone}/smb_app_data`, 'POST', token, { messaging_product: 'whatsapp', sync_type: 'history' });
      log('Chat history sync started.');
    }

    $('result').innerHTML = '<p><strong>Done.</strong> Save these for your backend, then close this tab.</p>';
    const pre = document.createElement('pre');
    pre.textContent = `WABA_ID=${session.waba}\nPHONE_NUMBER_ID=${session.phone || ''}\nBUSINESS_TOKEN=${token}`;
    $('result').appendChild(pre);
  } catch (err) {
    log(err.message, true);
  }
}

$('go').addEventListener('click', () => {
  const appId = $('appId').value.trim(), configId = $('configId').value.trim();
  if (!appId || !configId || !$('secret').value.trim()) { log('Fill in App ID, Configuration ID and App secret first.', true); return; }
  $('go').disabled = true;

  window.fbAsyncInit = () => {
    FB.init({ appId, autoLogAppEvents: true, xfbml: false, version: V });
    FB.login((resp) => {
      if (resp.authResponse && resp.authResponse.code) finish(resp.authResponse.code);
      else { log('Login window closed without finishing.', true); $('go').disabled = false; }
    }, {
      config_id: configId,
      response_type: 'code',
      override_default_response_type: true,
      extras: { setup: {}, featureType: 'whatsapp_business_app_onboarding', sessionInfoVersion: '3' }
    });
  };
  if (window.FB) window.fbAsyncInit();
  else {
    const s = document.createElement('script');
    s.src = 'https://connect.facebook.net/en_US/sdk.js';
    s.async = true; s.defer = true; s.crossOrigin = 'anonymous';
    document.body.appendChild(s);
  }
});
</script>
</body>
</html>
